<script>
let T=null,U=null,PAGE='',PREM=[],GL=[],DATA=null,QR=null,ST=null,OFF=0,OFFMODE=false,LASTVER='',SEEN={},NETFAIL=false,MAPK=null,POLLN=0;
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEV=((navigator.userAgent.match(/\(([^)]+)\)/)||[0,''])[1]).slice(0,60);
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function toast(m){const l=$('#login');if(l&&l.style.display!='none'){$('#lmsg').textContent=m}const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',4500)}
window.onerror=function(m,s,l){const t=$('#toast');t.textContent='Ralat: '+m+' (baris '+l+')';t.style.display='block'};
function rpc(fn,a,quiet){return new Promise(r=>{NETFAIL=false;a=Object.assign({},a||{},{_dev:DEV});
 google.script.run.withSuccessHandler(x=>{let o;try{o=JSON.parse(x)}catch(e){if(!quiet)toast('Respons pelayan tidak sah');return r(null)}
  if(o.error){if(/Sesi tamat/.test(o.error)&&T&&fn!='poll'){forceOut(o.error)}else if(!quiet)toast(o.error);r(null)}else r(o.data)})
 .withFailureHandler(e=>{NETFAIL=true;if(!quiet)toast(e&&e.message||'Tiada sambungan');r(null)}).rpc(fn,T||'',JSON.stringify(a))})}
function forceOut(m){toast(m||'Sesi tamat');setTimeout(()=>location.reload(),1500)}

/* ---------- bunyi alarm ---------- */
let AC=null;
function audioCtx(){try{const A=window.AudioContext||window.webkitAudioContext;if(!AC)AC=new A();if(AC.state=='suspended')AC.resume()}catch(e){}return AC}
document.addEventListener('click',audioCtx);document.addEventListener('touchstart',audioCtx,{passive:true});
function beep(n){const a=audioCtx();if(a){for(let i=0;i<(n||3);i++){[880,660].forEach((f,j)=>{const o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=f;g.gain.value=.25;o.connect(g);g.connect(a.destination);const t=a.currentTime+i*.7+j*.3;o.start(t);o.stop(t+.25)})}}try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch(e){}}
let WL=null;async function wake(){try{if(navigator.wakeLock)WL=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&U&&U.role=='guard')wake()});

/* ---------- navigasi ---------- */
const PG={
 dash:{t:'Dashboard (Ancaman)',r:'a',g:'MENU UTAMA'},map:{t:'Central Monitoring (Peta)',r:'a'},
 Attendance:{t:'Attendance Record',r:'ag'},Patrol:{t:'Laporan Rondaan',r:'ag'},
 term:{t:'Guard Mobile Terminal',r:'ag'},Visitors:{t:'Visitor Register (VMS)',r:'ag',v:1},LogBook:{t:'Security Log Book',r:'ag',l:1},comms:{t:'Komunikasi E2EE',r:'ag'},
 Threats:{t:'Ancaman & Insiden',r:'a'},
 Guards:{t:'HR - Pegawai',r:'a',g:'PENGURUSAN & HR',e:1,f:['Name','StaffNo','Phone','Email','Premise:@P','Shift:Shift1|Shift2|Shift3','Status:Active|Inactive','NewPIN:@K']},
 Complaints:{t:'Aduan & Salah Laku',r:'a',e:1,f:['Date:@D','Premise:@P','Description:@T','Status:Pending|Justified|Approved|Rejected|Resolved|Settled','Action']},
 Premises:{t:'Manage Premises',r:'a',e:1,f:['Name','Address:@T','Lat','Lng','Status:Active|Inactive']},
 Checkpoints:{t:'Checkpoint & QR',r:'a',e:1,f:['Premise:@P','Name','Seq:@N','Lat','Lng','Status:Active|Inactive']},
 Roster:{t:'Duty Roster & Report',r:'a',e:1,f:['GuardID:@G','Premise:@P','ShiftName','Start:@H','End:@H','Days:@W']},
 PatrolConfig:{t:'Alarm Rondaan',r:'a',e:1,f:['Premise:@P','IntervalMin:@N','AlarmSec:@N','Start:@H','End:@H','Active:Yes|No']},
 settings:{t:'Tetapan & Kata Laluan',r:'a'},AuditLog:{t:'Log Audit Keselamatan',r:'a'}};
const HELP={PatrolConfig:'Hanya admin boleh menetapkan selang rondaan dan tempoh bunyi alarm. Alarm berbunyi pada peranti pegawai apabila tiba masa rondaan dan hanya berhenti selepas pegawai mengimbas checkpoint.',
 Roster:'Pegawai hanya boleh Clock In / mengimbas dalam waktu syif (toleransi 30 minit lebih awal). Pegawai tanpa roster tidak dihadkan.'};
function buildNav(){let h='',cur='';Object.keys(PG).forEach(k=>{const g=PG[k];if(!g.r.includes(U.role=='admin'?'a':'g'))return;if(OFFMODE&&k!='term')return;if(g.g&&g.g!=cur){cur=g.g;h+=`<h6>${g.g}</h6>`}h+=`<a data-k="${k}" onclick="goPage('${k}')">${PG[k].t}</a>`});$('#nav').innerHTML=h}
async function goPage(k){PAGE=k;sd.classList.remove('o');document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.k==k));$('#ttl').textContent=PG[k].t;$('#c').innerHTML='Memuatkan...';
 const f={dash:showDash,map:showMap,term:showTerm,settings:showSettings,comms:showComms}[k];if(f)return f();showTable(k)}

/* ---------- log masuk ---------- */
let NEED2=false;
async function doLogin(){const m=$('#lmsg');m.textContent='';const id=$('#lid').value.trim(),pin=$('#lpw').value;if(!id||!pin){m.textContent='Masukkan ID dan kata laluan.';return}
 $('#lbtn').disabled=true;const d=await rpc('login',{id,pin,otp:$('#lotp').value});$('#lbtn').disabled=false;
 if(!d){return}
 if(d.need2fa){NEED2=true;$('#s2').style.display='';$('#lotp').focus();m.style.color='#6b7794';m.textContent='Masukkan kod 2FA.';return}
 T=d.token;U=d.user;$('#lpw').value='';$('#lotp').value='';await startApp()}
async function startApp(){$('#login').style.display='none';$('#app').style.display='block';$('#usr').textContent=U.name;$('#sir').style.display=U.role=='admin'?'':'none';$('#bell').style.display=U.role=='admin'?'':'none';
 if(U.mustEnroll){buildNav();return enrol2FA(true)}
 const p=await rpc('premises');PREM=p||[];if(U.role=='admin'){const g=await rpc('guardsLite');GL=g||[]}
 buildNav();if(U.role=='guard'){wake();await syncQ();const s=await rpc('patrolState',{},1);if(s)setST(s);cacheProfile()}
 goPage(U.role=='admin'?'dash':'term');pollLoop()}
function doLogout(){if(T)rpc('logout',{},1).then(()=>location.reload());else location.reload()}
document.addEventListener('DOMContentLoaded',()=>{});
$('#lbtn').addEventListener('click',doLogin);$('#lpw').addEventListener('keydown',e=>{if(e.key=='Enter')doLogin()});$('#lotp').addEventListener('keydown',e=>{if(e.key=='Enter')doLogin()});
$('#loff').addEventListener('click',offlineLogin);if((ls('pf')||[]).length)$('#loff').style.display='';

/* ---------- 2FA admin ---------- */
async function enrol2FA(force){const d=await rpc('totpBegin');if(!d)return;
 $('#mb').innerHTML=`<h3>Aktifkan Pengesahan Dua Faktor (2FA)</h3><p>Imbas kod QR dengan Google Authenticator / Microsoft Authenticator, kemudian masukkan kod 6 digit.</p><div style="text-align:center"><img src="${qrimg(d.uri,5)}"><p class="mono">${esc(d.secret)}</p></div><label>Kod 6 digit</label><input id="tc" inputmode="numeric" maxlength="6"><button onclick="confirm2FA()">Sahkan & Aktifkan</button>`;md.style.display='grid'}
async function confirm2FA(){if(await rpc('totpConfirm',{code:$('#tc').value})){U.mustEnroll=false;closeM();toast('2FA diaktifkan');startApp()}}

/* ---------- utiliti paparan ---------- */
const qrimg=(t,c)=>{const q=qrcode(0,'M');q.addData(t);q.make();return q.createDataURL(c||6,4)};
function closeM(){md.style.display='none';if(QR){QR.stop().catch(()=>{});QR=null}}
function cell(k,v,r){v=v==null?'':v;if(k=='PhotoURL')return v?`<button class="s g" onclick="showPhoto('${esc(v)}')">📷 Lihat</button>`:'';if(/^(Status|Severity|TotpOn|PasskeyOn|Active)$/.test(k)){if(k=='TotpOn'||k=='PasskeyOn')return v=='1'?'<span class="bd Yes">Aktif</span>':'<span class="bd" style="background:#94a3b8">-</span>';return `<span class="bd ${esc(v)}">${esc(v)}</span>`}
 if(k=='Hash'||k=='PrevHash')return `<span class="mono" title="${esc(v)}">${esc(String(v).slice(0,12))}…</span>`;if(k=='Action')return /Complaint/.test(PAGE)?esc(v):`<span class="bd ${/DELETE|FAIL|LOCK|DISABLED/.test(v)?'Critical':/LOGIN|LOGOUT|CREATE/.test(v)?'OK':/PASSWORD|THREAT/.test(v)?'High':'Justified'}">${esc(v)}</span>`;
 if(k=='Days')return String(v).split(',').map(d=>['','Isn','Sel','Rab','Kha','Jum','Sab','Ahd'][+d]||'').join(' ');return esc(v)}
async function showPhoto(id){$('#mb').innerHTML='Memuatkan gambar...';md.style.display='grid';const d=await rpc('photo',{id});if(!d){closeM();return}$('#mb').innerHTML=`<img src="${d}" style="width:100%;border-radius:6px"><button class="g" style="width:100%;margin-top:8px" onclick="closeM()">Tutup</button>`}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function csv(){const d=DATA;const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';dl(PAGE+'_'+new Date().toISOString().slice(0,10)+'.csv','﻿'+[d.cols.map(q).join(',')].concat(d.rows.map(r=>d.cols.map(c=>q(r[c])).join(','))).join('\n'),'text/csv')}
function json(){dl(PAGE+'.json',JSON.stringify(DATA.rows,null,2),'application/json')}

/* ---------- Dashboard ---------- */
async function showDash(){const d=await rpc('dash');if(!d)return;const c=(n,l,a)=>`<div class="card ${a&&n?'al':''}"><b>${n}</b><span>${l}</span></div>`;
 const mx=Math.max(1,...d.threatDays.map(x=>x.n));const ty=Object.keys(d.threatTypes).sort((a,b)=>d.threatTypes[b]-d.threatTypes[a]);
 $('#c').innerHTML=(d.totpOn?'':'<div class="card" style="border-left:4px solid var(--red);margin-bottom:12px">⚠ 2FA admin belum aktif. Pergi ke Tetapan.</div>')+
 `<div class="hero"><div><h2>Pusat Kawalan Keselamatan & Analisis Ancaman</h2><p>Dikemas kini masa nyata (setiap 5 saat). Ancaman baharu akan membunyikan siren.</p></div><div><button class="g" onclick="beep(3)">Uji Siren</button> <button class="g" onclick="goPage('AuditLog')">Log Audit</button></div></div>
 <div class="k">${c(d.threatsOpen,'Ancaman terbuka',1)}${c(d.premises,'Premis aktif')}${c(d.guards,'Pegawai aktif ('+d.inactive+' tidak aktif)')}${c(d.onDuty,'Sedang bertugas')}${c(d.patrolToday,'Imbasan hari ini')}${c(d.visitorsIn,'Pelawat di dalam')}${c(d.complaints,'Aduan belum selesai',1)}</div>
 <div class="two"><div class="dk"><b>Ancaman 7 hari terakhir</b><div class="bar" style="margin-top:22px">${d.threatDays.map(x=>`<div style="height:${Math.round(x.n/mx*100)}%"><span>${x.n}</span></div>`).join('')}</div><div class="lab">${d.threatDays.map(x=>`<span>${x.d}</span>`).join('')}</div></div>
 <div class="dk"><b>Jenis ancaman (30 hari)</b><div style="margin-top:10px">${ty.map(t=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #1d2a4a;padding:4px 0"><span>${esc(t)}</span><b>${d.threatTypes[t]}</b></div>`).join('')||'<span style="color:#9fb3e8">Tiada ancaman direkodkan.</span>'}</div></div></div>
 <h3>Status Rondaan</h3><div class="tw"><table><tr><th>Premis</th><th>Rondaan Terakhir</th><th>Rondaan Seterusnya</th><th>Pusingan</th><th>Status</th></tr>${d.tour.map(t=>`<tr><td>${esc(t.premise)}</td><td>${esc(t.last)}</td><td>${esc(t.next)}</td><td>${t.done}/${t.total}</td><td><span class="bd ${t.status}">${t.status}</span></td></tr>`).join('')||'<tr><td colspan=5>Tiada premis. Tambah di menu Manage Premises.</td></tr>'}</table></div>

function offAct(fn,a,label){if(!U||U.role!='guard'){toast('Tiada sambungan.');return null}
 if(fn=='clock'){toast('Clock In/Out memerlukan sambungan internet.');return null}
 const q=qget();if(q.length>=60){toast('Baris gilir penuh. Sambung ke internet.');return null}
 if(fn=='scan'){const cp=(ST&&ST.cps||[]).find(c=>c.QRCode==a.code);if(!cp){toast('Kod QR tidak dikenali (luar talian).');return null}if(cp.done){toast('Checkpoint ini sudah diimbas.');return null}cp.done=true;cp.at=new Date().toISOString().replace('T',' ').slice(0,19);ST.done=ST.cps.filter(c=>c.done).length;ST.started=true;ls('st_'+U.id,ST)}
 q.push({uid:U.id,fn,a:Object.assign({},a,fn=='sos'?{offline:1}:{}),ts:Date.now(),label});try{qset(q)}catch(e){toast('Storan peranti penuh.');return null}

  const r=await rpc(it.fn,a,1);if(r===null&&NETFAIL){stop=true;keep.push(it)}else if(r===null){bad++}else ok++}

const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pbk(pin,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,256))}
function cacheProfile(){if(!U||U.role!='guard')return;const a=(ls('pf')||[]).find(p=>p.uid==U.id);if(a){a.user=U;a.st=ST;a.at=Date.now();ls('pf',(ls('pf')||[]).map(p=>p.uid==U.id?a:p))}}
async function enrolPasskey(){if(!U||U.role!='guard')return;const prof={uid:U.id,user:U,st:ST,at:Date.now()};
 try{if(!window.PublicKeyCredential)throw 0;const cr=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Mega Safe'},user:{id:new TextEncoder().encode(U.id),name:U.name,displayName:U.name},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});prof.mode='webauthn';prof.cred=b64(cr.rawId)}
 catch(e){const pin=prompt('Biometrik/kunci pas tidak tersedia pada peranti ini. Tetapkan PIN peranti (minimum 6 digit) untuk mod luar talian:');if(!pin||pin.length<6)return toast('Dibatalkan');const salt=crypto.getRandomValues(new Uint8Array(16));prof.mode='pin';prof.salt=b64(salt);prof.hash=await pbk(pin,salt)}
 const all=(ls('pf')||[]).filter(p=>p.uid!=U.id);all.push(prof);ls('pf',all);await rpc('passkeyMark');toast('Kunci pas luar talian didaftarkan ('+(prof.mode=='webauthn'?'biometrik':'PIN peranti')+').')}
async function offlineLogin(){const pf=(ls('pf')||[]).filter(p=>Date.now()-p.at<14*864e5);if(!pf.length)return toast('Tiada kunci pas. Daftar semasa dalam talian (Terminal > Daftar Kunci Pas).');
 let p=pf[0];if(pf.length>1){const n=prompt('Pilih nombor:\n'+pf.map((x,i)=>(i+1)+'. '+x.user.name).join('\n'));p=pf[(+n||1)-1];if(!p)return}
 try{if(p.mode=='webauthn'){await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(p.cred)}],userVerification:'required',timeout:60000}})}
 else{const pin=prompt('PIN peranti:');if(!pin)return;if(await pbk(pin,unb64(p.salt))!==p.hash)return toast('PIN peranti salah.')}}catch(e){return toast('Pengesahan dibatalkan / gagal.')}
 OFFMODE=true;U=p.user;ST=p.st||ls('st_'+p.uid);if(ST)OFF=0;$('#login').style.display='none';$('#app').style.display='block';$('#usr').textContent=U.name+' (luar talian)';$('#off').style.display='block';$('#sir').style.display='none';$('#bell').style.display='none';buildNav();wake();goPage('term');pollLoop()}

/* ---------- enjin alarm ---------- */
let ringT=0,ALM=false;
function tick(){if(!U)return;$('#clk').textContent=new Date(nowS()).toLocaleString('ms-MY',{timeZone:'Asia/Kuala_Lumpur',hour12:false});
 if(U.role!='guard'||!ST)return;const s=ST,n=nowS(),nx=$('#nxt');qn();
 const ring=s.on&&!s.started&&n>=s.due&&n<s.due+s.alarmSec*1000,missed=s.on&&!s.started&&n>=s.due+s.alarmSec*1000;
 const bar=$('#alm');
 if(ring||missed){bar.style.display='flex';bar.className=ring?'':'q';$('#almT').textContent=ring?'⏰ MASA RONDA! Imbas checkpoint untuk menghentikan alarm ('+Math.max(0,Math.ceil((s.due+s.alarmSec*1000-n)/1000))+'s)':'⚠ Rondaan tertunggak. Imbas checkpoint sekarang.';if(ring&&Date.now()-ringT>1800){ringT=Date.now();beep(2)}}
 else bar.style.display='none';
 if(nx){nx.textContent=!s.on?'Tiada rondaan aktif (belum Clock In / luar waktu aktif)':(s.started?'Rondaan sedang dilakukan':(n<s.due?'Rondaan seterusnya dalam '+fmtD(s.due-n):'Rondaan tertunggak'))}}
const fmtD=ms=>{const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+'j ':'')+String(m).padStart(2,'0')+'m '+String(s%60).padStart(2,'0')+'s'};
setInterval(tick,1000);

/* ---------- masa nyata (polling) ---------- */
let polling=false;
async function pollLoop(){if(polling)return;polling=true;
 while(U){await new Promise(r=>setTimeout(r,U.role=='admin'?5000:8000));if(!U)break;if(OFFMODE||!T||document.hidden&&U.role=='admin')continue;
  const d=await rpc('poll',{},1);if(!d)continue;OFF=d.now-Date.now();
  if(d.st){const old=ST;setST(d.st);if(PAGE=='term'&&md.style.display!='grid'&&(!old||old.done!=d.st.done||old.started!=d.st.started))showTerm()}
  if(d.threats){const b=$('#bn');b.style.display=d.threats.length?'':'none';b.textContent=d.threats.length;let fresh=false;d.threats.forEach(t=>{if(!SEEN[t.ThreatID]){SEEN[t.ThreatID]=1;if(POLLN>0)fresh=true}});if(fresh){beep(4);toast('🚨 Ancaman baharu: '+d.threats[0].Type+' @ '+d.threats[0].Premise)}}
  POLLN++;
  if(d.ver!==LASTVER){const first=LASTVER==='';LASTVER=d.ver;if(!first&&md.style.display!='grid'&&['dash','Patrol','Attendance','Visitors','LogBook','Threats','Checkpoints'].includes(PAGE))goPage(PAGE)}
  if(PAGE=='comms'&&md.style.display!='grid')commsLoad()}
 polling=false}

/* ---------- tetapan & kata laluan ---------- */
async function showSettings(){const s=await rpc('getSettings');if(!s)return;const g=await rpc('list',{sheet:'Guards'});if(!g)return;GL=(g.rows||[]).map(x=>({id:x.GuardID,name:x.Name,staff:x.StaffNo}));
 $('#c').innerHTML=`<div class="hero"><div><h2>Tetapan Keselamatan & Pengurusan Kata Laluan (RBAC)</h2><p>Hanya Pentadbir boleh menukar kata laluan pegawai dan sistem. Pegawai tidak mempunyai akses menukar kata laluan.</p></div></div>
 <div class="two"><div class="card"><h3>Penukaran Kata Laluan Pegawai & Pentadbir</h3><label>Pilih akaun</label><select id="pt"><option value="admin">Administrator (admin)</option>${GL.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} (${esc(x.staff)})</option>`).join('')}</select><label>Kata laluan baharu</label><input id="pn" type="password" placeholder="Minimum 8 aksara" autocomplete="new-password"><label>Sahkan kata laluan baharu</label><input id="pc" type="password" autocomplete="new-password"><button style="width:100%" onclick="setPin()">Simpan Kata Laluan</button></div>
 <div class="card"><h3>Google Sheets, Amaran & Peta</h3><label>Google Sheet (pangkalan data & log masa nyata)</label><div class="mono" style="word-break:break-all"><a href="${esc(s.sheetUrl)}" target="_blank">${esc(s.sheetUrl)}</a></div><label style="margin-top:8px">URL Web App</label><div class="mono" style="word-break:break-all">${esc(s.execUrl)}</div>
 <label style="margin-top:8px">Emel amaran ancaman (dihantar automatik)</label><input id="ae" value="${esc(s.alertEmail)}" placeholder="pentadbir@syarikat.com">
 <label>Google Maps API Key ${s.hasMapsKey?'(sedia ada: '+esc(s.mapsKeyMasked)+')':''}</label><input id="mk" placeholder="${s.hasMapsKey?'Kosongkan jika tidak mahu tukar':'AIza... (pilihan; tanpa key peta asas dipaparkan)'}">
 <div>Pemantau rondaan latar belakang: <span class="bd ${s.triggers?'OK':'Pending'}">${s.triggers?'Dipasang':'Belum dipasang'}</span> <small>(menu Sheet: Mega Safe > Pasang pemantau)</small></div>
 <div style="margin-top:8px"><button class="k" onclick="saveSet()">Simpan Tetapan</button> <button class="g" onclick="rotHook()">${s.webhook?'Jana semula':'Jana'} rahsia Webhook IoT</button></div></div></div>
 <div class="card" style="margin-top:14px"><h3>Status Pengesahan Dua Faktor (2FA)</h3><div class="cps"><div class="cp" style="background:#fff;color:var(--ink);border-color:#e0e5f0"><b>Administrator</b><span class="bd ${s.totp?'OK':'Critical'}">${s.totp?'2FA Aktif':'Belum aktif'}</span>${s.totp?'':'<button class="s" onclick="enrol2FA()">Aktifkan 2FA</button>'}</div>
 ${(g.rows||[]).map(x=>`<div class="cp" style="background:#fff;color:var(--ink);border-color:#e0e5f0"><b>${esc(x.Name)}</b><small>${esc(x.StaffNo)} · ${esc(x.Premise)}</small>${x.TotpOn=='1'?`<span class="bd OK">2FA Aktif</span><button class="s g" onclick="g2fa('${esc(x.GuardID)}',0)">Nyahaktif</button>`:`<button class="s g" onclick="g2fa('${esc(x.GuardID)}',1)">Aktifkan 2FA</button>`}</div>`).join('')}</div></div>`}
async function setPin(){const m=await rpc('setPin',{target:$('#pt').value,pin:$('#pn').value,confirm:$('#pc').value});if(m){toast(m);$('#pn').value='';$('#pc').value='';if($('#pt').value=='admin')setTimeout(()=>location.reload(),1800)}}
async function saveSet(){const o={alertEmail:$('#ae').value};if($('#mk').value.trim())o.mapsKey=$('#mk').value;if(await rpc('saveSettings',o)){MAPK=null;toast('Tetapan disimpan');showSettings()}}
async function rotHook(){if(!confirm('Jana rahsia baharu? Rahsia lama tidak sah lagi.'))return;const r=await rpc('saveSettings',{rotateWebhook:1});if(r&&r.webhookSecret){$('#mb').innerHTML=`<h3>Rahsia Webhook IoT</h3><p>Simpan sekarang; tidak akan dipaparkan lagi.</p><div class="mono" style="word-break:break-all;background:#f2f4f8;padding:8px">${esc(r.webhookSecret)}</div><p style="font-size:12px">POST JSON ke URL Web App: {"secret":"…","premise":"Nama Premis","type":"Pintu dibuka","severity":"High","detail":"…"}</p><button onclick="closeM()">Tutup</button>`;md.style.display='grid'}}
async function g2fa(id,on){if(!confirm(on?'Aktifkan 2FA untuk pegawai ini? Pegawai wajib mendaftar kod dalam aplikasi Authenticator sebelum log masuk seterusnya.':'Nyahaktifkan 2FA pegawai ini?'))return;const r=await rpc('guard2fa',{id,on});if(!r)return;
 if(r.secret){$('#mb').innerHTML=`<h3>2FA: ${esc(r.name)}</h3><p>Tunjukkan kod QR ini kepada pegawai untuk diimbas dalam Authenticator. Ia tidak akan dipaparkan lagi.</p><div style="text-align:center"><img src="${qrimg(r.uri,5)}"><p class="mono">${esc(r.secret)}</p></div><button onclick="closeM();showSettings()">Selesai</button>`;md.style.display='grid'}else{toast('2FA dinyahaktifkan');showSettings()}}

/* ---------- komunikasi E2EE (AES-GCM; pelayan hanya melihat teks sulit) ---------- */
let CPREM='';
async function ckey(prem){const pw=ls('ck_'+prem);if(!pw)return null;const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:new TextEncoder().encode('MegaSafe|'+prem),iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
function showComms(){CPREM=U.role=='admin'?(CPREM||PREM[0]||''):U.premise;
 $('#c').innerHTML=`<div class="hero"><div><h2>Komunikasi Disulitkan Hujung-ke-Hujung</h2><p>Mesej disulitkan dalam pelayar (AES-256-GCM). Pelayan & Google Sheet hanya menyimpan teks sulit. Kongsi frasa kunci premis secara lisan/bersemuka.</p></div></div>
 ${U.role=='admin'?`<label>Premis</label><select onchange="CPREM=this.value;commsLoad()">${PREM.map(p=>`<option ${p==CPREM?'selected':''}>${esc(p)}</option>`).join('')}</select>`:''}
 <div class="card" style="margin:8px 0"><label>Frasa kunci premis ${ls('ck_'+CPREM)?'(telah ditetapkan pada peranti ini)':'(belum ditetapkan)'}</label><div style="display:flex;gap:8px"><input id="ckp" type="password" placeholder="Masukkan frasa kunci (min 10 aksara)" style="margin:0"><button onclick="setCK()">Simpan</button></div></div>
 <div class="card"><div id="ml" style="max-height:340px;overflow:auto"></div><div style="display:flex;gap:8px;margin-top:8px"><input id="mt" placeholder="Tulis mesej..." style="margin:0" onkeydown="if(event.key=='Enter')sendMsg()"><button onclick="sendMsg()">Hantar</button></div></div>`;commsLoad()}
function setCK(){const v=$('#ckp').value;if(v.length<10)return toast('Frasa minimum 10 aksara.');ls('ck_'+CPREM,v);toast('Kunci disimpan pada peranti ini');showComms()}
async function commsLoad(){const l=$('#ml');if(!l)return;const r=await rpc('msgList',{premise:CPREM},1);if(!r)return;const k=await ckey(CPREM);const out=[];
 for(const m of r){let t='🔒 (tetapkan frasa kunci)';if(k){try{t=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(m.IV)},k,unb64(m.Cipher)))}catch(e){t='🔒 (frasa kunci tidak sepadan)'}}
  out.push(`<div class="msg ${m.FromID==U.id?'me':''}"><small>${esc(m.FromName)} · ${esc(m.Timestamp.slice(5,16))}</small><br>${esc(t)}</div>`)}
 const at=l.scrollTop+l.clientHeight>=l.scrollHeight-30;l.innerHTML=out.join('')||'<span style="color:var(--mut)">Tiada mesej.</span>';if(at)l.scrollTop=l.scrollHeight}
async function sendMsg(){const t=$('#mt').value.trim();if(!t)return;const k=await ckey(CPREM);if(!k)return toast('Tetapkan frasa kunci dahulu.');const iv=crypto.getRandomValues(new Uint8Array(12));
 const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(t));if(await rpc('msgSend',{premise:CPREM,iv:b64(iv),cipher:b64(c)})){$('#mt').value='';commsLoad()}}
</script></body></html>
